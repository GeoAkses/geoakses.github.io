name: Release APK and AAB

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (defaults to v followed by versionName)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: geoakses

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Read version and release tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Could not read versionName and versionCode from app/build.gradle.kts." >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$VERSION_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format; got '$TAG'." >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Release keystore decoded."
          else
            echo "KEYSTORE_BASE64 is not configured; Gradle will use debug signing."
          fi

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        env:
          KEYSTORE_FILE: release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Name release artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK_NAME="GeoAkses-${VERSION_NAME}-${VERSION_CODE}-release.apk"
          AAB_NAME="GeoAkses-${VERSION_NAME}-${VERSION_CODE}-release.aab"
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          AAB_SOURCE="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK_SOURCE" || { echo "Missing release APK: $APK_SOURCE" >&2; exit 1; }
          test -f "$AAB_SOURCE" || { echo "Missing release AAB: $AAB_SOURCE" >&2; exit 1; }
          cp "$APK_SOURCE" "$APK_NAME"
          cp "$AAB_SOURCE" "$AAB_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
        id: artifacts

      - name: Upload APK and AAB to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeoAkses-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: |
            geoakses/${{ steps.artifacts.outputs.apk_name }}
            geoakses/${{ steps.artifacts.outputs.aab_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > release_notes.md <<EOF
          ## GeoAkses ${VERSION_NAME}

          Android release for version ${VERSION_NAME} (version code ${VERSION_CODE}).

          Includes the interactive OpenStreetMap view and TMB/MJT route directory. Bus telemetry is shown only when a live API feed is available; unavailable positions are not simulated.

          Download the APK for direct installation. The AAB is intended for Google Play Console.
          EOF

      - name: Create GitHub Release and attach APK/AAB
        uses: softprops/action-gh-release@v2
        with:
          name: GeoAkses ${{ steps.version.outputs.version_name }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: geoakses/release_notes.md
          draft: false
          prerelease: false
          files: |
            geoakses/${{ steps.artifacts.outputs.apk_name }}
            geoakses/${{ steps.artifacts.outputs.aab_name }}
