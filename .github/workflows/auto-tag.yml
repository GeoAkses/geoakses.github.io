name: 🏷️ Auto Tag on Version Bump

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'geoakses/app/build.gradle.kts'

permissions:
  contents: write

jobs:
  auto-tag:
    name: Create Git Tag from versionName
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract versionName from build.gradle.kts
        id: extract_version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' geoakses/app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' geoakses/app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (code: $VERSION_CODE)"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.extract_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist, will create."
          fi

      - name: Configure Git
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.extract_version.outputs.tag }}"
          VERSION="${{ steps.extract_version.outputs.version }}"
          VERSION_CODE="${{ steps.extract_version.outputs.version_code }}"
          git tag -a "$TAG" -m "Release $TAG (versionCode: $VERSION_CODE)"
          git push origin "$TAG"
          echo "✅ Created and pushed tag: $TAG"

      - name: Summary
        run: |
          echo "### 🏷️ Auto Tag Result" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_tag.outputs.exists }}" == "true" ]; then
            echo "Tag **${{ steps.extract_version.outputs.tag }}** already exists — no action taken." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Created tag **${{ steps.extract_version.outputs.tag }}** (versionCode: ${{ steps.extract_version.outputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          fi
