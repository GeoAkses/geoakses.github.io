name: Auto Tag

on:
  push:
    branches:
      - main
      - master
    paths:
      - geoakses/app/build.gradle.kts

permissions:
  actions: write
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' geoakses/app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' geoakses/app/build.gradle.kts | head -n 1)
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || -z "$VERSION_CODE" ]]; then
            echo "Could not read a semantic versionName and numeric versionCode." >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag if missing
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "GeoAkses $TAG (versionCode: $VERSION_CODE)"
          git push origin "$TAG"
          # Pushes made with GITHUB_TOKEN do not trigger another workflow run.
          gh workflow run release-apk-aab.yml --ref "$GITHUB_REF_NAME" -f tag_name="$TAG"

      - name: Write summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          echo "### Auto tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $TAG (versionCode $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
